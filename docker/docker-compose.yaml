version: '3.8'

services:
  # --- FLASK  ---
  api:
    container_name: api
    build:
      context: .
      dockerfile: Dockerfile
    user: "root"
    environment:
      - LAB_MODE=1
    volumes:
      - ./flask/templates:/app/templates
      - ./flask/static:/app/static
      - ../shared_data:/uploads
    ports:
      - "8000:8000"
    networks:
      - micro_internet
    depends_on:
      - db

  # --- VULNERABLE SERVICES ---
  webserver:
    container_name: webserver
    image: python:3.9-slim
    volumes:
      - ../python/vulnerable_server.py:/vulnerable_server.py
    command: python3 -u /vulnerable_server.py
    networks:
      - micro_internet

  victim:
    container_name: victim
    image: python:3.9-slim
    command: python3 -u -m http.server 8888
    networks:
      - micro_internet

  # --- DATABASE ---
  db:
    container_name: db
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb
    command: --secure-file-priv="" --log-error-verbosity=3
    networks:
      - micro_internet

  # --- TRAFFIC SIMULATOR (Background Noise) ---
  traffic_gen:
    container_name: traffic_gen
    image: python:3.9-slim
    volumes:
      - ../python/simulate_traffic.py:/simulate_traffic.py
    command: >
      bash -c "pip install requests pymysql redis paramiko psycopg2-binary -q &&
               python3 /simulate_traffic.py"
    networks:
      - micro_internet
    depends_on:
      - webserver
      - api
      - db
      - redis
      - postgres
      - jumpbox

  # --- INFRASTRUCTURE ---
  dns:
    container_name: dns
    image: python:3.9-slim
    volumes:
      - ../python/vulnerable_server.py:/vulnerable_server.py
    command: python3 -u /vulnerable_server.py --port 9000
    networks:
      - micro_internet

  fileshare:
    container_name: fileshare
    image: busybox
    command: sleep infinity
    volumes:
      - ../shared_data:/data
    networks:
      - micro_internet

  # --- ADDITIONAL EXPLOIT TARGETS ---
  redis:
    container_name: redis
    image: redis:6-alpine
    command: redis-server --protected-mode no
    networks:
      - micro_internet

  postgres:
    container_name: postgres
    image: postgres:13
    environment:
      POSTGRES_PASSWORD: postgres
    networks:
      - micro_internet

  jumpbox:
    container_name: jumpbox
    image: python:3.9-slim
    command: >
      bash -c "apt-get update -qq && apt-get install -y -qq openssh-server &&
      useradd -m -s /bin/bash ubuntu &&
      echo 'ubuntu:ubuntu' | chpasswd &&
      mkdir -p /run/sshd &&
      sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config &&
      /usr/sbin/sshd -D"
    networks:
      - micro_internet

  # --- ML WORM DETECTOR ---
  detector:
    container_name: detector
    build:
      context: ./detector
      dockerfile: Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../ml/models:/models:ro
      - ./detector/logs:/logs
    environment:
      - MODEL_DIR=/models
      - LOG_DIR=/logs
      - DETECT_INTERVAL=5
      - DETECT_THRESHOLD=0.5
    networks:
      - micro_internet
    restart: unless-stopped

  # --- IDS/IPS (Imported Snort) ---
  # ids:
  #   container_name: ids
  #   image: frapsoft/snort
  #   cap_add:
  #     - NET_ADMIN
  #     - NET_RAW
  #   volumes:
  #     - ./ids/rules:/etc/snort/rules:ro
  #     - ./ids/logs:/var/log/snort
  #   # Run snort in IDS mode with custom rules
  #   # Using snort-local.conf which includes local.rules
  #   command: >
  #     sh -c "snort -i eth0 
  #     -c /etc/snort/rules/snort-local.conf 
  #     -A console 
  #     -l /var/log/snort 
  #     2>&1"
  #   networks:
  #     - micro_internet

  # ips:
  #   container_name: ips
  #   image: alpine
  #   volumes:
  #     - ./ids/logs:/logs:ro
  #     - ./ips/blocklist:/blocklist
  #   command: /bin/sh -c "tail -f /logs/snort.alert"
  #   networks:
  #     - micro_internet
