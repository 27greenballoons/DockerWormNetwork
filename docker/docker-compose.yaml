version: '3.8'

services:
  # --- FLASK  ---
  api:
    container_name: api
    build: 
      context: .
      dockerfile: Dockerfile
    user: "root" 
    volumes:
      - ./flask/templates:/app/templates
      - ./flask/static:/app/static
      - ../shared_data:/uploads
    ports:
      - "8000:8000"
    networks:
      - micro_internet

  # --- VULNERABLE SERVICES ---
  webserver:
    container_name: webserver
    image: python:3.9-slim
    volumes:
      - ../python/vulnerable_server.py:/vulnerable_server.py
    command: python3 -u /vulnerable_server.py
    networks:
      - micro_internet

  victim:
    container_name: victim
    image: python:3.9-slim
    command: python3 -u -m http.server 8888
    networks:
      - micro_internet

  # --- INFRASTRUCTURE ---
  dns:
    container_name: dns
    image: busybox
    command: sleep infinity
    networks:
      - micro_internet

  fileshare:
    container_name: fileshare
    image: busybox
    command: sleep infinity
    volumes:
      - ../shared_data:/data
    networks:
      - micro_internet

