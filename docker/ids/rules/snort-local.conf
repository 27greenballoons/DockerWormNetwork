# Snort 2.x Configuration for DockerWormNetwork
# Minimal config for Docker bridge network monitoring

# Network variables
var HOME_NET any
var EXTERNAL_NET any
var HTTP_PORTS [80,8000,8080,8888]

# Path variables
var RULE_PATH /etc/snort/rules

# Configure the output
output alert_fast: /var/log/snort/alert.log

# Frag3 engine configuration (required)
preprocessor frag3_global: max_frags 65536
preprocessor frag3_engine: policy linux detect_anomalies

# TCP reassembly (required)
preprocessor stream5_global: track_tcp yes, track_udp yes, track_icmp no
preprocessor stream5_tcp: policy linux, detect_anomalies

# HTTP inspection (for better HTTP rule matching)
preprocessor http_inspect: global iis_unicode_map unicode.map 1252
preprocessor http_inspect_server: server default profile all ports { 80 8000 8080 8888 }

# Portscan detection (optional but useful)
preprocessor sfportscan: proto  { all } memcap { 10000000 } sense_level { low }

# Include our custom rules
include $RULE_PATH/local.rules

